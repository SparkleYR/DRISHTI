# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
# Configuration cache disabled for now: the app hosts a foreground Service and
# manual DI container; re-enable once the module is stable.
org.gradle.configuration-cache=false

# Local-only toolchain. Temurin 21 is downloaded at dev time to ~/.jdks; the
# system only ships a JRE 21 and a JDK 26, neither ideal for AGP 9.
org.gradle.java.home=/home/sparkle/.jdks/jdk-21.0.12.1+1
org.gradle.java.installations.paths=/home/sparkle/.jdks/jdk-21.0.12.1+1,/usr/lib/jvm/java-26-openjdk

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
